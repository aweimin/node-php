name: Publish npm Package

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            # 1. Checkout
            - name: Checkout
              uses: actions/checkout@v7

            # 2. Setup Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            # 3. OIDC trusted publishing 需要 npm >= 11.5.1，Node 24 自带的 npm 可能偏旧
            - name: Upgrade npm CLI
              run: |
                  npm install -g npm@latest
                  npm --version

            # 4. Verify version consistency (tag, main package, platform package)
            - name: Verify versions
              run: |
                  MAIN=$(node -p "require('./package.json').version")
                  SUB=$(node -p "require('./packages/win32-x64/package.json').version")
                  echo "main=$MAIN sub=$SUB"
                  [ "$MAIN" = "$SUB" ] \
                    || { echo "版本不一致: main=$MAIN sub=$SUB"; exit 1; }

                  if [ "${GITHUB_REF#refs/tags/v}" != "$GITHUB_REF" ]; then
                    TAG="${GITHUB_REF#refs/tags/v}"
                    echo "tag=$TAG"
                    [ "$TAG" = "$MAIN" ] \
                      || { echo "版本不一致: tag=$TAG main=$MAIN"; exit 1; }
                  else
                    echo "手动触发，跳过 tag 校验"
                  fi

            # 5. Verify packages
            - name: Verify main package
              run: npm pack --dry-run

            - name: Verify platform package
              working-directory: packages/win32-x64
              run: npm pack --dry-run

            # 6. Publish platform packages first (so the main package resolves them)
            - name: Publish win32-x64 binary package
              working-directory: packages/win32-x64
              run: npm publish --provenance --access public

            # 7. Publish main package last
            - name: Publish main package
              run: npm publish --provenance
